[project]
name = "metadata-agent-api"
version = "3.0.0"
description = "AI-powered metadata extraction API for educational content"
# SPDX (PEP 639); full text in LICENSE, third-party components in NOTICE.
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.0",
    # Bundles the Chromium of the screenshots: raise with every release (the CI
    # reports the browser's age; Renovate/Dependabot propose the update).
    "playwright>=1.63.0",
    "prometheus-client>=0.26.0",
    # Imported directly (middlewares, responses), not only through fastapi.
    # Floor: PYSEC-2026-249 (<1.3.1).
    "starlette>=1.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Ohne das ist `import src...` nur auffindbar, wenn pytest als `python -m pytest`
# startet — dann legt Python das Arbeitsverzeichnis selbst auf den sys.path. Das
# Konsolenskript `pytest` (und damit `uv run pytest` in der CI) tut das nicht:
# es fügt das Verzeichnis der Testdatei hinzu, nicht die Wurzel. Die Folge waren
# 31 Sammelfehler `ModuleNotFoundError: No module named 'src'` in einem Lauf, der
# lokal grün war.
pythonpath = ["."]
markers = [
    # Talks to a network service. Runs only with RUN_NETWORK_TESTS=1 and skips
    # itself when unreachable, so the suite stays offline by default.
    "slow: reaches an external service",
]

# Audit T-01: measured in CI (uv run pytest --cov). The floor sits just under
# the measured value (90 % with branches and the browser tests, 2026-10-18,
# final audit; 80 % before that round, 73 % before the first audit fixes);
# raise it with the tests.
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 87
skip_covered = true
show_missing = true

# Audits M-01 (2026-10-17, 2026-10-18): every function is split to complexity
# <= 15; ruff check in CI fails a function that grows past it.
[tool.ruff]
# Python files only: ruff 0.17 also formats the code blocks of Markdown files.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
# ruff's former defaults plus complexity, named so a ruff update does not
# change the rules (0.17 widened its defaults: 591 findings on Dependabot's PR).
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# Audit M-04: the mixins declare what they need from LLMService/RepositoryService
# (attributes and methods of sibling mixins); mypy checks every use - since
# audit T-07 (2026-10-18) in all of src.
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
# Also the bodies of functions without annotations (closures in the routers).
check_untyped_defs = true

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.0",
    # starlette.testclient prefers it; with httpx alone it warns (deprecated).
    "httpx2>=2.13.1",
    "pytest-cov>=6",
    "mypy>=1.15",
]

[tool.uv]
# Security floors for packages that arrive only transitively: nothing pins
# anyio or idna, so a fresh resolution could pick versions with known
# advisories (pip-audit: PYSEC-2026-4023/4024/4025 for anyio <4.14.2,
# PYSEC-2026-215 for idna <3.15). starlette is a direct dependency now and
# carries its floor there. python-dotenv comes with pydantic-settings and keeps
# the floor it had as a direct dependency. uv applies these when it locks; pip
# ignores [tool.uv].
constraint-dependencies = [
    "anyio>=4.14.2",
    "idna>=3.15",
    "python-dotenv>=1.2.2",
]
