[project]
name = "metadata-agent-api"
version = "3.0.0"
description = "AI-powered metadata extraction API for educational content"
# SPDX (PEP 639); full text in LICENSE, third-party components in NOTICE.
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
    "prometheus-client>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Ohne das ist `import src...` nur auffindbar, wenn pytest als `python -m pytest`
# startet — dann legt Python das Arbeitsverzeichnis selbst auf den sys.path. Das
# Konsolenskript `pytest` (und damit `uv run pytest` in der CI) tut das nicht:
# es fügt das Verzeichnis der Testdatei hinzu, nicht die Wurzel. Die Folge waren
# 31 Sammelfehler `ModuleNotFoundError: No module named 'src'` in einem Lauf, der
# lokal grün war.
pythonpath = ["."]
markers = [
    # Talks to a network service. Runs only with RUN_NETWORK_TESTS=1 and skips
    # itself when unreachable, so the suite stays offline by default.
    "slow: reaches an external service",
]

# Audit T-01: measured in CI (uv run pytest --cov). The floor sits just under
# the measured value (80 % with branches, 2026-10-18, without the browser
# tests; 73 % before the audit fixes); raise it with the tests.
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 79
skip_covered = true
show_missing = true

# Audits M-01 (2026-10-17, 2026-10-18): every function is split to complexity
# <= 15; ruff check in CI fails a function that grows past it.
[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# Audit M-04: the mixins declare what they need from LLMService/RepositoryService
# (attributes and methods of sibling mixins); mypy checks every use - since
# audit T-07 (2026-10-18) in all of src.
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
# Also the bodies of functions without annotations (closures in the routers).
check_untyped_defs = true

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.0",
    # starlette.testclient prefers it; with httpx alone it warns (deprecated).
    "httpx2>=2.13.1",
    "pytest-cov>=6",
    "mypy>=1.15",
]

[tool.uv]
# Security floors for packages that arrive only transitively: fastapi asks for
# starlette>=0.46.0 and nothing pins anyio or idna, so a fresh resolution could
# pick versions with known advisories (pip-audit: PYSEC-2026-249 for starlette
# <1.3.1, PYSEC-2026-4023/4024/4025 for anyio <4.14.2, PYSEC-2026-215 for
# idna <3.15). python-dotenv comes with pydantic-settings and keeps the floor
# it had as a direct dependency. uv applies these when it locks; pip ignores
# [tool.uv].
constraint-dependencies = [
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "idna>=3.15",
    "python-dotenv>=1.2.2",
]
