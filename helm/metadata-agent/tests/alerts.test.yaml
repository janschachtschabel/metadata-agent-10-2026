# promtool unit tests for files/alerts.yaml:
#   promtool test rules helm/metadata-agent/tests/alerts.test.yaml
# Annotations are copied from alerts.yaml; promtool compares them exactly.
rule_files:
- ../files/alerts.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_AUTH_REJECTED"}
    values: 0 1x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND"}
    values: 0 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations:
        summary: B-API lehnt den Schlüssel ab oder er fehlt
        description: KI-Aufrufe enden mit LLM_AUTH_* (401/403 oder kein Key). Key im Secret bzw. die LLM-Berechtigung des weitergereichten Keys prüfen.
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations:
        summary: B-API-Route unbekannt oder falsch eingerichtet
        description: KI-Aufrufe enden mit LLM_ROUTE_*. Route in der B-API und METADATA_AGENT_LLM_MODEL prüfen.
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="ok"}
    values: 0+5x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_RATE_LIMITED"}
    values: 0+1x15
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_UNREACHABLE"}
    values: 0+1x15
  alert_rule_test:
  - eval_time: 15m
    alertname: MetadataAgentLlmThrottled
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: KI-Aufrufe werden gedrosselt
        description: Mehr als 5 KI-Aufrufe in 15 Minuten scheiterten auch nach Wiederholung an 429 (Kontingent, GWDG-Limit).
  - eval_time: 10m
    alertname: MetadataAgentLlmUnreachable
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: KI-Dienst nicht erreichbar
        description: Mehr als 3 KI-Aufrufe in 10 Minuten bekamen auch nach Wiederholung keine Antwort (Timeout, Verbindung abgelehnt).
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_RATE_LIMITED"}
    values: 0 1 2 2x12
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_UNREACHABLE"}
    values: 0 1 1x13
  alert_rule_test:
  - eval_time: 15m
    alertname: MetadataAgentLlmThrottled
    exp_alerts: []
  - eval_time: 10m
    alertname: MetadataAgentLlmUnreachable
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0+1x30
  - series: metadata_agent_generations_total{namespace="wlo",status="success"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: Mehr als die Hälfte der Erschließungen scheitert
        description: Über 50 % der /generate-Läufe der letzten 30 Minuten endeten mit failed (bei mindestens 3 Läufen). Logs nach error.code durchsuchen.
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0+1x30
  - series: metadata_agent_generations_total{namespace="wlo",status="success"}
    values: 0+3x30
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0 1 2 2x28
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="repository"}
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
        service: repository
      exp_annotations:
        summary: Ein abhängiger Dienst antwortet nicht
        description: Mehr als 3 Aufrufe in 10 Minuten an den Dienst im Label service blieben ohne Antwort (Timeout, Verbindung abgelehnt).
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="repository"}
    values: 0+1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="200"}
    values: 0+1x10
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="llm"}
    values: 0+10x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="text-extraction",status="503"}
    values: 0+1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="text-extraction",status="200"}
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
        service: text-extraction
      exp_annotations:
        summary: Ein abhängiger Dienst antwortet mit Serverfehlern
        description: Mehr als 5 Antworten mit Status 5xx in 10 Minuten vom Dienst im Label service.
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="text-extraction",status="503"}
    values: 0 1 1x9
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamServerErrors
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="90"}
    values: '0x40'
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="120"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="+Inf"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: /generate nähert sich dem Ingress-Timeout
        description: 95 % der Erschließungen brauchen bis zu über 100 s; ab 120 s bricht das Ingress ab. Modell, Kontingent und METADATA_AGENT_REQUEST_TIMEOUT prüfen.
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="20"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="90"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="120"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="+Inf"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts: []
