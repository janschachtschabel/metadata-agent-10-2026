# promtool unit tests for files/alerts.yaml:
#   promtool test rules helm/metadata-agent/tests/alerts.test.yaml
# Annotations are copied from alerts.yaml; promtool compares them exactly.
rule_files:
- ../files/alerts.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 0 1x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 0 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: &id002
        summary: B-API lehnt den eigenen Schlüssel ab oder es fehlt jeder Schlüssel
        description: KI-Aufrufe mit der konfigurierten Einstellung enden mit LLM_AUTH_* (401/403, oder kein Key - im Modus forward fehlt dann der vom Proxy weitergereichte). B_API_KEY im Secret bzw. forwardDelegation/forwardApiKey
          im B-API-Proxy prüfen.
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: &id001
        summary: Konfiguriertes Modell bzw. B-API-Route nicht verfügbar
        description: KI-Aufrufe mit dem konfigurierten Modell enden mit LLM_ROUTE_* oder LLM_MODEL_NOT_FOUND. Route in der B-API und das Modell (METADATA_AGENT_B_API_*_MODEL) prüfen.
# OPS-06: a series that first appears at 1 - the first failure on a fresh pod
# before the first scrape (or a label set nobody pre-created). increase()
# alone sees no rise there; the time of the last failure is under 10 minutes
# ago (gauges in seconds; the test clock starts at 0).
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 30x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_MODEL_NOT_FOUND",auth_source="static",config="default"}
    values: _x3 1x7
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_MODEL_NOT_FOUND",auth_source="static",config="default"}
    values: _x3 170x7
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: *id002
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: *id001
# ... and stops once that failure is older than the window.
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 1x30
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 30x30
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 1x30
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 30x30
  # Pre-created at start (src/metrics.py) and never failed.
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_AUTH_MISSING",auth_source="none",config="default"}
    values: _x15 0x15
  alert_rule_test:
  - eval_time: 20m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 20m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
# A scrape gap of more than 10 minutes (Prometheus restart, target unreachable)
# does not make an old counter look new.
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 1x20 _x15 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 30x20 _x15 30x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 1x20 _x15 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 30x20 _x15 30x10
  alert_rule_test:
  - eval_time: 38m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 38m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
# A forwarded key or a requested model never pages, new series or not.
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_AUTH_FORBIDDEN",auth_source="forwarded",config="default"}
    values: 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_AUTH_FORBIDDEN",auth_source="forwarded",config="default"}
    values: 30x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="override"}
    values: 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="new",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="override"}
    values: 30x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="ok",auth_source="static",config="default"}
    values: 0+5x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_MODEL_NOT_FOUND",auth_source="static",config="default"}
    values: 0 1x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_AUTH_MISSING",auth_source="none",config="default"}
    values: 0 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: *id001
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: *id002
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_AUTH_FORBIDDEN",auth_source="forwarded",config="default"}
    values: 0 1x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="override"}
    values: 0 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 5m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
  - eval_time: 5m
    alertname: MetadataAgentLlmCallerKeyRefused
    exp_alerts: []
  - eval_time: 5m
    alertname: MetadataAgentLlmRequestedModelRejected
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_AUTH_FORBIDDEN",auth_source="forwarded",config="default"}
    values: 0+1x15
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="override"}
    values: 0+1x15
  alert_rule_test:
  - eval_time: 15m
    alertname: MetadataAgentLlmCallerKeyRefused
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: Weitergereichte Schlüssel von Aufrufern werden abgelehnt
        description: Mehr als 5 KI-Aufrufe in 15 Minuten mit dem vom B-API-Proxy weitergereichten Schlüssel enden mit LLM_AUTH_*. Den Schlüsseln der aufrufenden Anwendungen fehlt die LLM-Berechtigung; der
          eigene Betrieb ist nicht betroffen.
  - eval_time: 15m
    alertname: MetadataAgentLlmRequestedModelRejected
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: Von Anfragen gewählte Modelle oder Routen scheitern
        description: Mehr als 5 KI-Aufrufe in 15 Minuten mit einem per Anfrage gewählten Provider oder Modell (llm_provider/llm_model) scheitern an Route, Modell oder Berechtigung. Die aufrufende Anwendung
          nennt ein Modell, das es nicht gibt oder das der Schlüssel nicht darf.
  - eval_time: 15m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 15m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_RATE_LIMITED",auth_source="static",config="default"}
    values: 0+1x15
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_UNREACHABLE",auth_source="static",config="default"}
    values: 0+1x15
  alert_rule_test:
  - eval_time: 15m
    alertname: MetadataAgentLlmThrottled
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: KI-Aufrufe werden gedrosselt
        description: Mehr als 5 KI-Aufrufe in 15 Minuten scheiterten auch nach Wiederholung an 429 (Kontingent, GWDG-Limit).
  - eval_time: 10m
    alertname: MetadataAgentLlmUnreachable
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: KI-Dienst nicht erreichbar
        description: Mehr als 3 KI-Aufrufe in 10 Minuten bekamen auch nach Wiederholung keine Antwort (Timeout, Verbindung abgelehnt).
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_RATE_LIMITED",auth_source="static",config="default"}
    values: 0 1 2 2x12
  - series: metadata_agent_llm_requests_total{namespace="wlo",provider="b-api-openai",result="LLM_UNREACHABLE",auth_source="static",config="default"}
    values: 0 1 1x13
  alert_rule_test:
  - eval_time: 15m
    alertname: MetadataAgentLlmThrottled
    exp_alerts: []
  - eval_time: 10m
    alertname: MetadataAgentLlmUnreachable
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0+1x30
  - series: metadata_agent_generations_total{namespace="wlo",status="success"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: Mehr als die Hälfte der Erschließungen scheitert
        description: Über 50 % der /generate-Läufe der letzten 30 Minuten endeten mit failed (bei mindestens 3 Läufen). Logs nach error.code durchsuchen.
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0+1x30
  - series: metadata_agent_generations_total{namespace="wlo",status="success"}
    values: 0+3x30
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0 1 2 2x28
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts: []
# Audit 14.11.: a run the client gave up (cancelled) or the pod did not take on
# (refused, 503 TOO_MANY_GENERATIONS) is neither a failure nor a finished run.
# They must not hide failures ...
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0+1x30
  - series: metadata_agent_generations_total{namespace="wlo",status="cancelled"}
    values: 0+3x30
  - series: metadata_agent_generations_total{namespace="wlo",status="refused"}
    values: 0+3x30
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations:
        summary: Mehr als die Hälfte der Erschließungen scheitert
        description: Über 50 % der /generate-Läufe der letzten 30 Minuten endeten mit failed (bei mindestens 3 Läufen). Logs nach error.code durchsuchen.
# ... nor count as failures or towards the three runs.
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="failed"}
    values: 0 1 2 2x28
  - series: metadata_agent_generations_total{namespace="wlo",status="cancelled"}
    values: 0+1x30
  - series: metadata_agent_generations_total{namespace="wlo",status="refused"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_generations_total{namespace="wlo",status="cancelled"}
    values: 0+1x30
  - series: metadata_agent_generations_total{namespace="wlo",status="success"}
    values: 0 1 1x28
  alert_rule_test:
  - eval_time: 30m
    alertname: MetadataAgentGenerationsFailing
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="repository"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 15m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
        service: repository
      exp_annotations:
        summary: Ein abhängiger Dienst antwortet nicht
        description: Mehr als 3 Aufrufe in 10 Minuten an den Dienst im Label service blieben ohne Antwort (Timeout, Verbindung abgelehnt).
# Calls in flight are not yet answered: a burst answered within minutes
# does not alert (for: 5m, audit 18.10. final).
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="repository"}
    values: 0 0 6x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="200"}
    values: 0 0 0 0 0 6x7
  - series: metadata_agent_upstream_response_duration_seconds_count{namespace="wlo",service="repository"}
    values: 0 0 0 0 0 6x7
  alert_rule_test:
  - eval_time: 4m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts: []
  - eval_time: 9m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="repository"}
    values: 0+1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="200"}
    values: 0+1x10
  - series: metadata_agent_upstream_response_duration_seconds_count{namespace="wlo",service="repository"}
    values: 0+1x10
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="llm"}
    values: 0+10x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts: []
# Audit 14.11., O-35: every call answered, four status codes for the first
# time (their series start at 1, which increase() does not count). Answers are
# therefore read from the histogram's count, which has one series per service.
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="repository"}
    values: 0+10x5 54x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="200"}
    values: 0+10x5 50x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="500"}
    values: _x6 1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="502"}
    values: _x6 1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="503"}
    values: _x6 1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="504"}
    values: _x6 1x10
  - series: metadata_agent_upstream_response_duration_seconds_count{namespace="wlo",service="repository"}
    values: 0+10x5 54x10
  alert_rule_test:
  - eval_time: 13m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts: []
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="text-extraction",status="503"}
    values: 0+1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="text-extraction",status="200"}
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
        service: text-extraction
      exp_annotations:
        summary: Ein abhängiger Dienst antwortet mit Serverfehlern
        description: Mehr als 5 Antworten mit Status 5xx in 10 Minuten vom Dienst im Label service.
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="text-extraction",status="503"}
    values: 0 1 1x9
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamServerErrors
    exp_alerts: []
# Audit 13.11., OPS-20: the B-API refusing the key for text extraction or
# geocoder is no 5xx - without a rule of its own nobody would see it.
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="geocoder",status="403"}
    values: 0+1x10
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="text-extraction",status="401"}
    values: 0 1 1x9
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="repository",status="403"}
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamKeyRefused
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
        service: geocoder
      exp_annotations:
        summary: Textextraktion oder Geocoder lehnen den Schlüssel ab
        description: Mehr als 3 Antworten mit Status 401 oder 403 in 10 Minuten vom Dienst im Label service; betroffen sind Erschließungen aus einer URL bzw. die Koordinaten von Orten (mit auto fragt der Agent Photon dann direkt, mit proxy bleiben Orte ohne Koordinaten). Über die B-API (METADATA_AGENT_B_API_SERVICES auto oder proxy) fehlt dem Schlüssel das Recht für deren Proxy-Dienst (text-extraction bzw. photon_geocoding); bei direktem Aufruf (direct oder eigene Adresse) verlangt der Dienst selbst eine Anmeldung.
# OPS-13: service="other" is any URL a caller hands in (preview images):
# their outages are not ours.
- interval: 1m
  input_series:
  - series: metadata_agent_upstream_responses_total{namespace="wlo",service="other",status="502"}
    values: 0+1x10
  - series: metadata_agent_upstream_requests_total{namespace="wlo",service="other"}
    values: 0+2x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentUpstreamUnanswered
    exp_alerts: []
  - eval_time: 10m
    alertname: MetadataAgentUpstreamServerErrors
    exp_alerts: []
# Audit 14.11., O-33: the share of runs above 270 s, read from the 270 s bucket
# (le as prometheus_client writes it). Every run between 270 and 300 s:
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="270.0"}
    values: '0x40'
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="300.0"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="+Inf"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations: &slow
        summary: /generate nähert sich seinem Zeitlimit
        description: Mehr als 5 % der Erschließungen der letzten 15 Minuten brauchten über 270 s; nach 300 s (METADATA_AGENT_GENERATE_TIMEOUT) bricht der Agent mit 504 ab. Modell, Kontingent, Textlänge und METADATA_AGENT_REQUEST_TIMEOUT prüfen.
# One run in ten above 270 s.
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="270.0"}
    values: 0+9x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="300.0"}
    values: 0+10x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="+Inf"}
    values: 0+10x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
      exp_annotations: *slow
# One run in 25 (4 %) is below the threshold.
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="270.0"}
    values: 0+24x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="+Inf"}
    values: 0+25x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts: []
# Every run at 121-150 s: far from the deadline. Without buckets between 120
# and 300 s such runs read as a p95 of 291 s.
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="120.0"}
    values: '0x40'
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="150.0"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="270.0"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="300.0"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="+Inf"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts: []
# 19.10.: runs of 90-120 s (a long source such as the Goethe article, 126 s)
# are within the 300 s deadline - no longer an alert (the threshold was 100 s).
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="90.0"}
    values: '0x40'
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="120.0"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="270.0"}
    values: 0+1x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",method="POST",route="/generate",le="+Inf"}
    values: 0+1x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts: []
# While pods of an image without the 270 s bucket still run (rolling update),
# their runs are not counted as slow.
- interval: 1m
  input_series:
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",pod="old",method="POST",route="/generate",le="120.0"}
    values: 0+10x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",pod="old",method="POST",route="/generate",le="300.0"}
    values: 0+10x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",pod="old",method="POST",route="/generate",le="+Inf"}
    values: 0+10x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",pod="new",method="POST",route="/generate",le="270.0"}
    values: 0+10x40
  - series: metadata_agent_http_request_duration_seconds_bucket{namespace="wlo",pod="new",method="POST",route="/generate",le="+Inf"}
    values: 0+10x40
  alert_rule_test:
  - eval_time: 35m
    alertname: MetadataAgentGenerateSlow
    exp_alerts: []
# The agent's own 5xx per route; probe paths stay out (audit 18.10. final).
- interval: 1m
  input_series:
  - series: metadata_agent_http_requests_total{namespace="wlo",method="POST",route="/generate",status="502"}
    values: 0+1x10
  - series: metadata_agent_http_requests_total{namespace="wlo",method="GET",route="/ready",status="503"}
    values: 0+5x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
        route: /generate
      exp_annotations:
        summary: Der Agent antwortet mit Serverfehlern
        description: Mehr als 5 Antworten mit Status 5xx in 10 Minuten auf der Route im Label route. Ursache steht im Log unter error.code (UPSTREAM_ERROR, GENERATION_TIMEOUT, LLM_* …).
# INTERNAL_ERROR pages on the first one - also when its series starts at 1 ...
- interval: 1m
  input_series:
  - series: metadata_agent_http_requests_total{namespace="wlo",method="POST",route="/upload",status="500"}
    values: _x3 1x7
  - series: metadata_agent_http_last_internal_error_timestamp_seconds{namespace="wlo",route="/upload"}
    values: _x3 170x7
  alert_rule_test:
  - eval_time: 5m
    alertname: MetadataAgentInternalError
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
        route: /upload
      exp_annotations:
        summary: Unerwarteter Fehler im Agent (INTERNAL_ERROR)
        description: Eine Anfrage auf der Route im Label route endete mit 500 INTERNAL_ERROR - ein Fehler im Agent selbst. Log-Zeile mit derselben request_id enthält den Stacktrace.
  - eval_time: 5m
    alertname: MetadataAgentServerErrors
    exp_alerts: []
# ... and stops once that error is older than the window.
- interval: 1m
  input_series:
  - series: metadata_agent_http_requests_total{namespace="wlo",method="POST",route="/upload",status="500"}
    values: 1x90
  - series: metadata_agent_http_last_internal_error_timestamp_seconds{namespace="wlo",route="/upload"}
    values: 30x90
  alert_rule_test:
  - eval_time: 80m
    alertname: MetadataAgentInternalError
    exp_alerts: []
# Audit 14.11.: 503 TOO_MANY_GENERATIONS is back-pressure by design
# (METADATA_AGENT_MAX_CONCURRENT_GENERATIONS), counted as status="refused".
- interval: 1m
  input_series:
  - series: metadata_agent_http_requests_total{namespace="wlo",method="POST",route="/generate",status="503"}
    values: 0+1x10
  - series: metadata_agent_generations_total{namespace="wlo",status="refused"}
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentServerErrors
    exp_alerts: []
# Other 5xx on /generate still count, also beside refused runs; so does a 503
# on another route.
- interval: 1m
  input_series:
  - series: metadata_agent_http_requests_total{namespace="wlo",method="POST",route="/generate",status="503"}
    values: 0+2x10
  - series: metadata_agent_generations_total{namespace="wlo",status="refused"}
    values: 0+1x10
  - series: metadata_agent_http_requests_total{namespace="wlo",method="POST",route="/upload",status="503"}
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: MetadataAgentServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: wlo
        route: /generate
      exp_annotations: &errors
        summary: Der Agent antwortet mit Serverfehlern
        description: Mehr als 5 Antworten mit Status 5xx in 10 Minuten auf der Route im Label route. Ursache steht im Log unter error.code (UPSTREAM_ERROR, GENERATION_TIMEOUT, LLM_* …).
    - exp_labels:
        severity: warning
        namespace: wlo
        route: /upload
      exp_annotations: *errors
# Audit 14.11., O-34: a scrape gap of 75 minutes (longer than the hour the
# rules first looked back for "new" series) does not make an old failure a
# new one ...
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 1x20 _x75 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 30x20 _x75 30x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 1x20 _x75 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 30x20 _x75 30x10
  - series: metadata_agent_http_requests_total{namespace="wlo",pod="old",method="POST",route="/upload",status="500"}
    values: 1x20 _x75 1x10
  - series: metadata_agent_http_last_internal_error_timestamp_seconds{namespace="wlo",pod="old",route="/upload"}
    values: 30x20 _x75 30x10
  alert_rule_test:
  - eval_time: 98m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 98m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
  - eval_time: 98m
    alertname: MetadataAgentInternalError
    exp_alerts: []
# ... nor does a gap of 30 hours, longer than any look-back. The agent says
# itself when it last failed (gauges in seconds; the test clock starts at 0).
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 1x20 _x1800 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 30x20 _x1800 30x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 1x20 _x1800 1x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 30x20 _x1800 30x10
  - series: metadata_agent_http_requests_total{namespace="wlo",pod="old",method="POST",route="/upload",status="500"}
    values: 1x20 _x1800 1x10
  - series: metadata_agent_http_last_internal_error_timestamp_seconds{namespace="wlo",pod="old",route="/upload"}
    values: 30x20 _x1800 30x10
  alert_rule_test:
  - eval_time: 1823m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 1823m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts: []
  - eval_time: 1823m
    alertname: MetadataAgentInternalError
    exp_alerts: []
# A failure after such a gap is a fresh one: the counter rose while nobody
# scraped (increase() sees two equal samples), the time of the failure is new.
- interval: 1m
  input_series:
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 1x20 _x1800 2x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_AUTH_REJECTED",auth_source="static",config="default"}
    values: 30x20 _x1800 109200x10
  - series: metadata_agent_llm_requests_total{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 1x20 _x1800 2x10
  - series: metadata_agent_llm_last_failure_timestamp_seconds{namespace="wlo",pod="old",provider="b-api-openai",result="LLM_ROUTE_NOT_FOUND",auth_source="static",config="default"}
    values: 30x20 _x1800 109200x10
  - series: metadata_agent_http_requests_total{namespace="wlo",pod="old",method="POST",route="/upload",status="500"}
    values: 1x20 _x1800 2x10
  - series: metadata_agent_http_last_internal_error_timestamp_seconds{namespace="wlo",pod="old",route="/upload"}
    values: 30x20 _x1800 109200x10
  alert_rule_test:
  - eval_time: 1823m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: *id002
  - eval_time: 1823m
    alertname: MetadataAgentLlmRouteMisconfigured
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
      exp_annotations: *id001
  - eval_time: 1823m
    alertname: MetadataAgentInternalError
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: wlo
        route: /upload
      exp_annotations:
        summary: Unerwarteter Fehler im Agent (INTERNAL_ERROR)
        description: Eine Anfrage auf der Route im Label route endete mit 500 INTERNAL_ERROR - ein Fehler im Agent selbst. Log-Zeile mit derselben request_id enthält den Stacktrace.
  # ... and stops paging ten minutes after it.
  - eval_time: 1832m
    alertname: MetadataAgentLlmKeyRefused
    exp_alerts: []
  - eval_time: 1832m
    alertname: MetadataAgentInternalError
    exp_alerts: []
