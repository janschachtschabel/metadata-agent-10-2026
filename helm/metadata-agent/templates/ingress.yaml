{{- if .Values.ingress.enabled }}
{{- /* What the agent accepts and what nginx lets through were coupled in the
       defaults only: a raised METADATA_AGENT_MAX_REQUEST_BYTES met the old 20m
       at the ingress. Without the annotation (another controller) no check. */}}
{{- $size := index (.Values.ingress.annotations | default dict) "nginx.ingress.kubernetes.io/proxy-body-size" }}
{{- $expected := include "metadata-agent.bodySize" . }}
{{- if and $size (ne (toString $size) $expected) }}
{{- fail (printf "ingress annotation proxy-body-size is %v, env.METADATA_AGENT_MAX_REQUEST_BYTES needs %s - set both to the same size" $size $expected) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "metadata-agent.fullname" . }}
  labels:
    {{- include "metadata-agent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "metadata-agent.fullname" . }}
                port:
                  name: http
{{- end }}
