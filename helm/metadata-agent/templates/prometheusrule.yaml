{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "metadata-agent.fullname" . }}
  labels:
    {{- include "metadata-agent.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Plain Prometheus rule file, so promtool can test it (tests/alerts.test.yaml).
  {{- .Files.Get "files/alerts.yaml" | nindent 2 }}
{{- end }}
