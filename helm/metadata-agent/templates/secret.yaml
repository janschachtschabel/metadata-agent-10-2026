{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metadata-agent.secretName" . }}
  labels:
    {{- include "metadata-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{- if not (has $key $.Values.secret.keys) }}
  {{- fail (printf "secret.values.%s is not one of secret.keys" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
