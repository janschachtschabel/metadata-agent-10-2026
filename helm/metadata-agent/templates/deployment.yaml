{{- include "metadata-agent.checkValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metadata-agent.fullname" . }}
  labels:
    {{- include "metadata-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "metadata-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metadata-agent.labels" . | nindent 8 }}
      {{- /* No checksum/secret annotation (audit OPS-11): an unsalted hash of
             the secret values is readable by anyone who can read Deployments.
             After a Secret change: kubectl rollout restart (values.yaml). */}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # The agent never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: metadata-agent
          image: {{ include "metadata-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
            - name: internal
              containerPort: {{ .Values.service.internalPort }}
          env:
            {{- $shared := .Values.sharedLlmLimit }}
            {{- range $name, $value := .Values.env }}
            {{- if has $name (list "METADATA_AGENT_INTERNAL_PORT" "FORWARDED_ALLOW_IPS" "UVICORN_HOST" "METADATA_AGENT_INTERNAL_HOST" "METADATA_AGENT_GRACE_PERIOD_SECONDS") }}
            {{- fail (printf "env.%s: set by the chart (service.internalPort, forwardedAllowIps, listenHost, terminationGracePeriodSeconds) - remove it from the values" $name) }}
            {{- end }}
            {{- if and $shared.enabled (has $name (list "METADATA_AGENT_LLM_MAX_CONCURRENT_REQUESTS" "METADATA_AGENT_LLM_MAX_REQUESTS_PER_SECOND")) }}
            {{- fail (printf "env.%s: set by the chart from sharedLlmLimit - remove it from the values or disable sharedLlmLimit" $name) }}
            {{- end }}
            - name: {{ $name }}
              value: {{ include "metadata-agent.envValue" $value | quote }}
            {{- end }}
            # The port the probes and the ServiceMonitor use - one value.
            - name: METADATA_AGENT_INTERNAL_PORT
              value: {{ .Values.service.internalPort | quote }}
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.forwardedAllowIps | quote }}
            # One address for both ports, so they cannot listen on different
            # address families (values.yaml, listenHost).
            - name: UVICORN_HOST
              value: {{ .Values.listenHost | quote }}
            - name: METADATA_AGENT_INTERNAL_HOST
              value: {{ .Values.listenHost | quote }}
            # The agent's start warnings compare its deadlines with it.
            - name: METADATA_AGENT_GRACE_PERIOD_SECONDS
              value: {{ .Values.terminationGracePeriodSeconds | quote }}
            {{- if $shared.enabled }}
            {{- if le (float64 $shared.requestsPerMinute) 0.0 }}
            {{- fail "sharedLlmLimit.requestsPerMinute must be greater than 0: a rate of 0 means 'no limit' to the agent" }}
            {{- end }}
            # The GWDG limit is shared by all replicas, the throttle counts per
            # pod (values.yaml, sharedLlmLimit).
            - name: METADATA_AGENT_LLM_MAX_CONCURRENT_REQUESTS
              value: {{ max 1 (div (int $shared.concurrentRequests) (max 1 (int .Values.replicaCount))) | quote }}
            {{- $rate := printf "%.4f" (divf $shared.requestsPerMinute (mulf 60 (max 1 (int .Values.replicaCount)))) }}
            {{- if eq $rate "0.0000" }}
            {{- fail "sharedLlmLimit.requestsPerMinute divided by replicaCount rounds to a rate of 0, which means 'no limit' to the agent - raise it or lower replicaCount" }}
            {{- end }}
            - name: METADATA_AGENT_LLM_MAX_REQUESTS_PER_SECOND
              value: {{ $rate | quote }}
            {{- end }}
            {{- /* optional: a key the configured mode does not need may be
                   missing; /ready reports a mode that cannot work and missing
                   repository credentials (WLO_GUEST_*), so a typo in
                   existingSecret leaves the pods unready. */}}
            {{- range .Values.secret.keys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "metadata-agent.secretName" $ }}
                  key: {{ . }}
                  optional: true
            {{- end }}
          startupProbe:  # schemas load at start
            httpGet: {path: /health, port: internal}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: internal}
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: internal}
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            # Let the endpoint removal reach the ingress before uvicorn stops
            # accepting connections.
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.scratchVolumes.tmpSizeLimit }}
        - name: home
          emptyDir:
            sizeLimit: {{ .Values.scratchVolumes.homeSizeLimit }}
      {{- with .Values.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "metadata-agent.selectorLabels" $ | nindent 14 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
