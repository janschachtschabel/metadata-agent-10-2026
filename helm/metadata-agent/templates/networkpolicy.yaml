{{- if .Values.networkPolicy.enabled }}
{{- /* Only the B-API proxy may call the API: the service has no authorization
       of its own on several write paths (UEBERGABE, audit S-01). Rules render
       only for non-empty lists - an empty from/to would allow everything. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metadata-agent.fullname" . }}
  labels:
    {{- include "metadata-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metadata-agent.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.ingressNamespaces }}
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.prometheusNamespaces }}
    - from:
        {{- range .Values.networkPolicy.prometheusNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: internal
          protocol: TCP
    {{- end }}
  egress:
    # DNS - inside the cluster only to the cluster DNS (audit OPS-10), not to
    # every pod. Public addresses fall under the internet rule below, all ports
    # (pages to screenshot may use any). dns.namespace "" opens it for
    # NodeLocal DNSCache.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with .Values.networkPolicy.dns }}
      {{- if .namespace }}
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          {{- with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      {{- end }}
      {{- end }}
    {{- if .Values.networkPolicy.egressNamespaces }}
    # In-cluster services the agent calls (B-API, text extraction), on the
    # ports of their pods only - not the databases next to them.
    - to:
        {{- range .Values.networkPolicy.egressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      {{- with .Values.networkPolicy.egressPorts }}
      ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- end }}
    {{- end }}
    # Public internet (repository, geocoder, pages to screenshot, preview
    # images) - never private ranges, so a page or preview URL cannot reach
    # cluster-internal addresses (audit B-02, S-04).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.egressExceptCidrs | nindent 14 }}
{{- end }}
