  # Alternative: Native OpenAI
  # =========================================
  # metadata-agent-api-openai:
  #   build: .
  #   container_name: metadata-agent-api-openai
  #   ports:
  #     - "127.0.0.1:8002:8000"
  #   read_only: true
  #   tmpfs: [/tmp, /home/appuser]
  #   stop_grace_period: 120s
