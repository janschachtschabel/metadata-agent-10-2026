stages:
  - build
  - test
  - deploy

# One pipeline per push (audit OPS-05): a merge request pipeline for a branch
# with an open MR - the one the MR widget and "Pipelines must succeed" look at -
# otherwise a branch or tag pipeline. main and develop always get their branch
# pipeline, because the image is published from it; with an open MR from
# develop that means two pipelines for the same commit, on purpose.
# A scheduled pipeline (CI/CD > Schedules, on main) runs only the jobs under
# "Scheduled checks" below: every other job refuses it first.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Every check job extends this. A job without rules only runs in branch and
# tag pipelines, never in a merge request pipeline - the tests did not gate
# merges until 2026-10-18.
.check:
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

variables:
  # Same uv as the Dockerfile, so CI and image resolve alike.
  UV_VERSION: 0.7.13
  # The tests run on the image's own base (Debian 13 "trixie", Dockerfile) -
  # uv 0.7.13 has no trixie image, so uv is installed into it.
  CI_PYTHON_IMAGE: python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

# see: https://docs.astral.sh/uv/guides/integration/gitlab/#using-uv-in-gitlab-cicd

.base_ruff:
  extends: .check
  stage: build
  image:
    # Same ruff as uv.lock, so `ruff format --diff` agrees with local runs
    # (tests/test_ci_hygiene.py holds the two together).
    name: ghcr.io/astral-sh/ruff:0.17.4-alpine@sha256:7a717be3a7cfbef698a9b99e1555add93ec6b195242fe273997683e49b051f51
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

Ruff Check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab > code-quality-report.json
  artifacts:
    # Also on failure: findings are exactly when the report is needed.
    when: always
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

Ruff Format:
  extends: .base_ruff
  script:
    - ruff format --diff

# helm for "run tests": tests/test_helm_chart.py renders the chart and skipped
# itself here until 2026-10-18 - the uv image has no helm. The binary is static
# and comes from the same pinned image as "helm lint" (audit OPS-09).
helm binary:
  extends: .check
  stage: build
  image:
    name: alpine/helm:3.20.0@sha256:2240b3c3e917a156c4af570c7f8bdf951072196de69f2a0d06e2cd2fc0ba40a8
    entrypoint: [""]
  script:
    - mkdir -p tools
    - cp "$(command -v helm)" tools/helm
  artifacts:
    paths:
      - tools/helm
    expire_in: 1 day

# Runs the whole pytest suite. Until 2026-08-18 this job printed a reminder to
# implement tests and went green — 1176 tests existed and none of them ran.
#
# Two of them are the reason this job has to stay honest:
#   tests/test_schema_declarations.py  — every list in every schema must say
#     what it holds, and no field path may be an object in one schema and a
#     string in another. Elasticsearch maps ccm:oeh_extendedData dynamically, so
#     a single contradiction there locks correct records out of the index and
#     stalls the collection sync, which is what happened in August 2026.
#   tests/test_object_shape_is_enforced.py — /validate and the repository write
#     path must both refuse a bare string in an object-typed field.
#
# Tests that reach an external service carry the `slow` marker and run only
# with RUN_NETWORK_TESTS=1 (skipping when it is unreachable), so this stays
# offline and runnable on a sealed runner.
run tests:
  extends: .check
  stage: test
  image: $CI_PYTHON_IMAGE
  variables:
    UV_CACHE_DIR: .uv-cache
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.playwright-browsers
    # Without Chromium the browser tests fail here instead of skipping (T-03).
    REQUIRE_BROWSER: "1"
    # Likewise the rendered-chart tests without helm ("helm binary").
    REQUIRE_HELM: "1"
    # And check_browser_age.py when it cannot tell the age of the browser.
    REQUIRE_BROWSER_AGE: "1"
  dependencies: ["helm binary"]
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
    # Own key, so the uv cache above never drops the browsers. uv.lock pins the
    # Playwright version.
    - key:
        files:
          - uv.lock
        prefix: playwright
      paths:
        - .playwright-browsers
  script:
    - pip install uv==$UV_VERSION
    - export PATH="$CI_PROJECT_DIR/tools:$PATH"
    - helm version --short
    - uv sync --locked
    # The browser tests (shipped widget bundle, screenshot URL policy) skip
    # themselves without Chromium — install it so they actually run here.
    # Chromium comes from the cache after the first run; --with-deps still
    # installs the system libraries each time.
    - uv run playwright install --with-deps chromium
    # The bundled Chromium: reported, and fails the job when it is more than
    # two major versions behind the stable Chrome (audit 18.10. final) - or,
    # without the version service, when the locked playwright is too old.
    - uv run python scripts/check_browser_age.py
    # -rs lists every skipped test with its reason in the job log.
    - uv run pytest -q -rs --cov
    - uv run mypy
  after_script:
    - uv cache prune --ci

# Known vulnerabilities in exactly what the image installs: requirements.txt is
# the export of uv.lock, with hashes (audit DEP-02).
pip audit:
  extends: .check
  stage: test
  image: $CI_PYTHON_IMAGE
  script:
    - pip install uv==$UV_VERSION
    - uvx pip-audit==2.10.1 -r requirements.txt --require-hashes --disable-pip

# The development tools (pytest, ruff, mypy …) never reach the image: a finding
# here is reported, not a reason to stop the pipeline.
pip audit dev:
  extends: .check
  stage: test
  image: $CI_PYTHON_IMAGE
  allow_failure: true
  script:
    - pip install uv==$UV_VERSION
    - uv export --frozen --only-dev --format requirements-txt --no-emit-project > dev-requirements.txt
    - uvx pip-audit==2.10.1 -r dev-requirements.txt --require-hashes --disable-pip

# The Helm chart and its alert rules. tests/test_helm_chart.py (run tests)
# checks them against the code; these check that helm and Prometheus accept
# them, and promtool runs the alert unit tests (helm/metadata-agent/tests/).
# The tool images are pinned by digest (audit OPS-09): they read the chart, and
# a moved tag would silently change what checks it.
helm lint:
  extends: .check
  stage: test
  image:
    name: alpine/helm:3.20.0@sha256:2240b3c3e917a156c4af570c7f8bdf951072196de69f2a0d06e2cd2fc0ba40a8
    entrypoint: [""]
  script:
    - helm lint helm/metadata-agent --strict --set image.repository=ci/metadata-agent-api
    - helm lint helm/metadata-agent --strict --set image.repository=ci/metadata-agent-api --set ingress.enabled=true
    - mkdir -p rendered
    - helm template ci helm/metadata-agent --set image.repository=ci/metadata-agent-api > rendered/default.yaml
    - helm template ci helm/metadata-agent --set image.repository=ci/metadata-agent-api --set ingress.enabled=true > rendered/ingress.yaml
  artifacts:
    paths:
      - rendered/
    expire_in: 1 day

# The rendered manifests against the Kubernetes schemas (audit T-07); the
# Prometheus Operator kinds against the CRDs catalog, pinned to a commit (a
# moved branch would change the check). Both schema sets are fetched at run
# time. The Kubernetes version is named: without it the schemas of the newest
# release are used, which move. The image has a shell only in its -alpine
# variant.
kubeconform:
  extends: .check
  stage: test
  needs: ["helm lint"]
  image:
    name: ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0
    entrypoint: [""]
  script:
    - /kubeconform -strict -summary -kubernetes-version 1.33.0 -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' rendered/default.yaml rendered/ingress.yaml

alert rules:
  extends: .check
  stage: test
  image:
    name: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    entrypoint: [""]
  script:
    - promtool check rules helm/metadata-agent/files/alerts.yaml
    - promtool test rules helm/metadata-agent/tests/alerts.test.yaml

.dind:
  image: $DIND_IMAGE
  #  see: https://hub.docker.com/_/docker
  variables:
    DOCKER_HOST: "$DIND_HOST"
    DOCKER_DRIVER: "$DIND_DRIVER"
    DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]
  before_script:
    - docker --version

# Started read-only and without keys the image must answer /health and start
# Chromium (scripts/smoke-image.sh; the published port is reachable under the
# service alias "docker"), and critical vulnerabilities with a fix available
# stop it (audit OPS-03).
.check image: &check_image
  - sh scripts/smoke-image.sh "$IMAGE" docker
  - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE"

# A merge request builds and checks the image without publishing it.
check docker image in merge requests:
  extends: .dind
  stage: test
  variables:
    IMAGE: metadata-agent-api:mr-$CI_MERGE_REQUEST_IID
  script:
    - docker buildx build --load --build-arg VERSION="$CI_COMMIT_REF_NAME" --build-arg REVISION="$CI_COMMIT_SHA" --tag "$IMAGE" .
    - *check_image
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

build and push docker image from main and develop branches:
  extends: .dind
  stage: deploy
  variables:
    IMAGE: $DOCKER_REGISTRY/projects/wlo/meta-services/metadata-agent-api:$CI_COMMIT_REF_SLUG
  script:
    - docker buildx build --load --build-arg VERSION="$CI_COMMIT_REF_SLUG" --build-arg REVISION="$CI_COMMIT_SHA" --tag "$IMAGE" .
    - *check_image
    # Log in only now (audit OPS-09): build, smoke test and scanner run with
    # the Docker socket, the password must not be in the daemon's config yet.
    - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME --password-stdin
    - docker image push "$IMAGE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: "$CI_COMMIT_BRANCH == 'main'"
    - if: "$CI_COMMIT_BRANCH == 'develop'"

build and push docker image on tag creation:
  extends: .dind
  stage: deploy
  variables:
    IMAGE: $DOCKER_REGISTRY/projects/wlo/meta-services/metadata-agent-api:$CI_COMMIT_REF_NAME
  script:
    # The tag names the version the code ships (audit 13.11., OPS-22): chart,
    # image tag and service version are one number.
    - |
      version="v$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
      if [ "$CI_COMMIT_TAG" != "$version" ]; then
        echo "Tag $CI_COMMIT_TAG passt nicht zur Version $version in pyproject.toml"; exit 1
      fi
    - docker buildx build --load --build-arg VERSION="$CI_COMMIT_REF_NAME" --build-arg REVISION="$CI_COMMIT_SHA" --tag "$IMAGE" .
    - *check_image
    # What the release ships, as CycloneDX (audit 14.11., O-32). To stdout: a
    # volume would be one of the docker-in-docker service, not of this job.
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --quiet "$IMAGE" > sbom.cdx.json
    # Log in only now, as above.
    - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME --password-stdin
    - docker image push "$IMAGE"
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 1 year
  # Release tags only (v3.0.0); another tag publishes nothing. The release image
  # is rebuilt from the tagged commit, not promoted from main: main is
  # published under the moving tag "main" only, so there is no immutable main
  # image of that commit to promote (see CHANGELOG 3.0.0, CI).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ----------------------------------------------------------------------------
# Scheduled checks (audit 14.11., O-32)
# ----------------------------------------------------------------------------
# An image was checked once, before it was published; what is found in its
# packages or its browser afterwards was never reported. A pipeline schedule on
# main (CI/CD > Schedules) runs these two jobs and nothing else.

.scheduled:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# The locked dependencies against the advisories of today, and the age of the
# bundled Chromium.
scheduled dependency checks:
  extends: .scheduled
  image: $CI_PYTHON_IMAGE
  variables:
    REQUIRE_BROWSER_AGE: "1"
  script:
    - pip install uv==$UV_VERSION
    - uvx pip-audit==2.10.1 -r requirements.txt --require-hashes --disable-pip
    - uv sync --locked
    - uv run python scripts/check_browser_age.py

# The newest released image: HIGH and CRITICAL vulnerabilities with a fix
# available fail the job - the sign to release again. SCAN_TAG (a variable of
# the schedule) names another tag; empty, the newest release tag (vX.Y.Z) of
# the repository is taken from the remote, because a shallow clone need not
# have it.
scheduled image scan:
  extends: [.dind, .scheduled]
  variables:
    SCAN_TAG: ""
  script:
    - |
      tag="${SCAN_TAG:-$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' | grep -E 'refs/tags/v[0-9]+[.][0-9]+[.][0-9]+$' | head -n 1 | sed 's|.*refs/tags/||')}"
      if [ -z "$tag" ]; then echo "Kein Release-Tag (v*) gefunden"; exit 1; fi
      echo "Scanning release $tag"
      IMAGE="$DOCKER_REGISTRY/projects/wlo/meta-services/metadata-agent-api:$tag"
    - echo "$DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u $DOCKER_USERNAME --password-stdin
    - docker pull "$IMAGE"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --quiet "$IMAGE" > sbom.cdx.json
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE"
  artifacts:
    # Also when the scan fails: the list of what the image ships is then needed.
    when: always
    paths:
      - sbom.cdx.json
    expire_in: 30 days
