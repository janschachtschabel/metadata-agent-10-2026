name: Docker Build & Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite
        run: |
          pip install uv==0.7.13
          uv sync --locked
          uv run playwright install --with-deps chromium
          uv run pytest -q -rs

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pull requests only build: their code must not run next to the
      # DockerHub password, and an unmerged change must not be published.
      - uses: azure/docker-login@v1
        if: github.event_name != 'pull_request'
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v4
      - name: Build Docker image
        run: docker build --tag ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }} .
      - name: Publish to DockerHub
        if: github.event_name != 'pull_request'
        run: docker push ${{ github.repository }}:${{ env.GITHUB_REF_SLUG }}
