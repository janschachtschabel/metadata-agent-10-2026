name: Scheduled checks

# An image was checked once, before it was published; what is found in its
# packages or its browser afterwards was never reported (audit 14.11., O-32).
# GitHub pauses schedules of a repository without activity for 60 days.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The locked dependencies against the advisories of today, and the age of
  # the bundled Chromium.
  dependencies:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_BROWSER_AGE: "1"
      UV_PYTHON: "3.13.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Audit dependencies
        run: |
          pip install uv==0.7.13
          uvx pip-audit==2.10.1 -r requirements.txt --require-hashes --disable-pip
      - name: Age of the bundled browser
        run: |
          uv sync --locked
          uv run python scripts/check_browser_age.py

  # The newest released image on DockerHub: HIGH and CRITICAL vulnerabilities
  # with a fix available fail the job - the sign to release again.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # From the remote: the checkout is shallow and need not have the tag.
      - name: Newest release
        run: |
          tag="$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' | grep -E 'refs/tags/v[0-9]+[.][0-9]+[.][0-9]+$' | head -n 1 | sed 's|.*refs/tags/||')"
          if [ -z "$tag" ]; then echo "::error::Kein Release-Tag (v*) gefunden"; exit 1; fi
          echo "IMAGE=${{ github.repository }}:$tag" >> "$GITHUB_ENV"
      # What the release ships, as CycloneDX. In the job summary only its size:
      # keeping the file needs actions/upload-artifact pinned to a commit.
      - name: Software bill of materials
        run: |
          docker pull "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --quiet "$IMAGE" > sbom.cdx.json
          echo "SBOM of $IMAGE: $(grep -c '"bom-ref"' sbom.cdx.json) components" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan the image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE"
